services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whispernet-backend
    ports:
      - "8002:8000"
    env_file:
      - ./backend/.env
    volumes:
      # Hot-reload: mount source code for development
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
